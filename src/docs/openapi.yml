openapi: '3.0.3'
info:
  title: Auth REST API
  description: OpenAPI (Swagger) Demo API
  version: '1.0'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https:/test/api/v1
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /auth/register:
    post:
      summary: Register a user
      description: Registers a new user on the server
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string

      responses:
        '201':
          description: 'Successfully registers a user and returns their id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: 
                    type: string
                  userId:
                    type: string
                    description: The id of the newly created user
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /auth/verify-otp:
    post:
      summary: Verify an email using OTP
      description: Verifies a user's email using a 6 digit OTP
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - userId
                - code
              properties:
                userId:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: 'Successfully verifies an email'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: 
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /auth/login:
    post:
      summary: Log in a user
      description: Logs in a registered user
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 'Successfully logged in a user'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: 
                    type: string
                  token:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /auth/logout:
    post:
      summary: Logs out a user
      description: Logs out a user
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logs out a user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: 
                    type: string
        '400':
          description: Token is missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /user/profile:
    get:
      summary: Fetches a user's a profile
      description: Fetches a user's profile
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully returned a user's profile
          content:
            application/json:
              schema:
                required:
                  - id
                  - email
                  - isVerified
                  - createdAt
                properties:
                  id: 
                    type: string
                  email:
                    type: string
                  isVerified:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
        '401':
          description: Token or userId is missing
          content:
            application/json:
              schema:
                required:
                  - id
                  - email
                  - isVerified
                  - createdAt
                properties:
                  id: 
                    type: string
                  email:
                    type: string
                  isVerified:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
        '404':
          description: User profile not found
          content:
            application/json:
              schema:
                required:
                  - error
                properties:
                  error:
                    type: string
                  